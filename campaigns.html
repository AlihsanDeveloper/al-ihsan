<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Al Ihsan · Campaign Archive</title>
<link rel="icon" type="image/png" href="images/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="style.css">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=DM+Sans:wght@400;500;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { margin: 0; background: #060644; color: #f0f0ea; font-family: 'DM Sans', sans-serif; font-size: 17px; line-height: 1.6; }
a { color: #56aeff; text-decoration: none; transition: 0.2s ease; }
a:hover { color: #f0f0ea; }
input, select, textarea { width: 100%; padding: 13px 16px; border-radius: 10px; border: 1px solid rgba(86,174,255,0.35); background: #03032e; color: #f0f0ea; font-family: 'DM Sans', sans-serif; font-size: 15px; outline: none; }
input:focus, select:focus, textarea:focus { border-color: #56aeff; }
.filter-btn { padding: 8px 12px; border-radius: 8px; color: rgba(240,240,234,0.8); cursor: pointer; }
.filter-btn.active { background: #004995; color: #f0f0ea; font-weight: 700; }
.year-pill { padding: 6px 12px; border-radius: 999px; border: 1px solid rgba(86,174,255,0.5); cursor: pointer; }
.year-pill.active { background: #56aeff; color: #060644; font-weight: 700; }

  /* Campaign Card Image Blending & Vignette */
  .campaign-img-wrapper {
    flex: 1 1 240px;
    min-height: 240px;
    background: #004995;
    position: relative;
    overflow: hidden;
  }

  .campaign-img-wrapper img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    position: relative;
    z-index: 1;
    transition: transform 0.4s ease;
  }

  /* The Vignette & Blend Overlay */
  .campaign-img-wrapper::after {
    content: '';
    position: absolute;
    inset: 0;
    z-index: 2;
    pointer-events: none; /* Allows clicking through to the image if needed */

    /* 1. Blend the right edge into the card background */
    /* 2. A subtle vignette around the edges */
    /* 3. A slight darkening at the bottom */
    background:
      linear-gradient(to right, transparent 60%, rgba(0,73,149,0.6) 100%),
      radial-gradient(circle, transparent 40%, rgba(3,3,46,0.7) 100%),
      linear-gradient(to top, rgba(3,3,46,0.8) 0%, transparent 50%);
  }

  /* Optional: Slight zoom effect on hover */
  .campaign-img-wrapper:hover img {
    transform: scale(1.05);
  }

</style>
  <script defer src="https://cloud.umami.is/script.js" data-website-id="edb3beda-67c8-4ea9-8118-8fb19986c4d9"></script>
</head>
<body>
<div style="width: 100%; background: #060644; color: #f0f0ea; font-family: 'DM Sans', sans-serif; font-size: 17px; line-height: 1.6">

<!-- NAV (Donate and About switched positions) -->
<div id="header-placeholder" style="position: sticky; top: 0; z-index: 100;"></div>


<!-- HEADER -->
<div style="background-color: #060644; background-image: linear-gradient(rgba(86,174,255,0.07) 1px, transparent 1px), linear-gradient(90deg, rgba(86,174,255,0.07) 1px, transparent 1px); background-size: 48px 48px">
  <div style="max-width: 1200px; margin: 0 auto; padding: 42px 32px 42px; display: flex; flex-direction: column; gap: 14px">
    <div style="font-family: 'JetBrains Mono', monospace; font-size: 13px; letter-spacing: 0.18em; text-transform: uppercase; color: #56aeff">Campaign archive</div>
    <h1 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 48px; line-height: 1.1; letter-spacing: -0.02em">Every campaign, on record</h1>
    <p style="margin: 0; max-width: 640px; color: rgba(240,240,234,0.8)">A transparent timeline of what we have done together, from Ramadan drives to special appeals.</p>
  </div>
</div>

<!-- DASHBOARD BODY -->
<div class="mobile-stack" style="max-width: 1200px; margin: 0 auto; padding: 24px 32px 96px; display: flex; flex-wrap: wrap; gap: 40px; align-items: flex-start">

  <!-- SIDEBAR -->
  <div class="mobile-pad" style="flex: 0 0 260px; max-width: 100%; padding: 24px; border: 1px solid rgba(86,174,255,0.22); border-radius: 16px; background: rgba(0,73,149,0.16); display: flex; flex-direction: column; gap: 24px">
    <div style="display: flex; flex-direction: column; gap: 10px">
      <div style="font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: #56aeff">Type</div>
      <div id="type-list" style="display: flex; flex-direction: column; gap: 8px; font-size: 15px">
        <div class="filter-btn active" onclick="filterType('ALL', this)">All campaigns</div>
        <div class="filter-btn" onclick="filterType('Ramadan', this)">Ramadan Campaign</div>
        <div class="filter-btn" onclick="filterType('Special appeal', this)">Special appeals</div>
        <div class="filter-btn" onclick="filterType('Community drive', this)">Community drives</div>
      </div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 10px">
      <div style="font-family: 'JetBrains Mono', monospace; font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: #56aeff">Year</div>
      <div id="year-list" style="display: flex; flex-wrap: wrap; gap: 8px; font-family: 'JetBrains Mono', monospace; font-size: 13px">
        <div class="year-pill active" onclick="filterYear('ALL', this)">All</div>
        <div class="year-pill" onclick="filterYear('2026', this)">[ 2026 ]</div>
        <div class="year-pill" onclick="filterYear('2025', this)">[ 2025 ]</div>
        <div class="year-pill" onclick="filterYear('2024', this)">[ 2024 ]</div>
      </div>
    </div>
  </div>

  <!-- MAIN COLUMN -->
  <div style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 40px">
        <!-- STAT TILES -->
    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px;">
      <div style="padding: 20px 22px; border: 1px solid rgba(86,174,255,0.22); border-radius: 14px; background: rgba(0,73,149,0.16)">
        <div id="st-camp" style="font-family: 'JetBrains Mono', monospace; font-size: 30px; color: #56aeff; white-space: nowrap;">00</div>
        <div style="font-size: 14px; color: rgba(240,240,234,0.75); margin-top: 4px;">Campaigns</div>
      </div>
      <div style="padding: 20px 22px; border: 1px solid rgba(86,174,255,0.22); border-radius: 14px; background: rgba(0,73,149,0.16)">
        <div id="st-expense" style="font-family: 'JetBrains Mono', monospace; font-size: 30px; color: #56aeff; white-space: nowrap;">৳ 0</div>
        <div style="font-size: 14px; color: rgba(240,240,234,0.75); margin-top: 4px;">Total Expense</div>
      </div>
      <div style="padding: 20px 22px; border: 1px solid rgba(86,174,255,0.22); border-radius: 14px; background: rgba(0,73,149,0.16)">
        <div id="st-people" style="font-family: 'JetBrains Mono', monospace; font-size: 30px; color: #56aeff; white-space: nowrap;">0</div>
        <div style="font-size: 14px; color: rgba(240,240,234,0.75); margin-top: 4px;">People Engaged</div>
      </div>
    </div>

    <!-- TIMELINE -->
    <div style="position: relative; padding-left: 36px; display: flex; flex-direction: column; gap: 32px">
      <div style="position: absolute; left: 7px; top: 8px; bottom: 8px; width: 2px; background: rgba(86,174,255,0.35)"></div>
      <div id="timeline-items" style="display: flex; flex-direction: column; gap: 32px"></div>
    </div>
  </div>
</div>

<script>
// 1. EMBEDDED FALLBACK DATA (Shows up instantly if you open the file locally)
var DEFAULT_EVENTS = [
  {
    "year": "2026",
    "type": "Ramadan",
    "title": "Ramadan Grocery Drive 2026",
    "itemsDistributed": 3000,
    "Donors": 1200,
    "expense": 1500000,
    "imageUrl": "images/ramadan-2026.jpg",
    "reportUrl": "reports/ramadan-2026.pdf"
  }
];

var eventsData = DEFAULT_EVENTS;
var activeType = "ALL";
var activeYear = "ALL";

// 2. TRY TO FETCH JSON
fetch('./campaigns.json')
  .then(r => r.json())
  .then(d => { 
      if(d && d.length > 0) {
          eventsData = d; 
          renderEvents(); 
      }
  })
  .catch(() => {
      // If fetch is blocked by local file security, it quietly uses DEFAULT_EVENTS
      console.log("Using embedded fallback campaigns data.");
      renderEvents(); 
  });

// 3. FILTER FUNCTIONS
function filterType(t, el) {
  activeType = t;
  document.querySelectorAll('#type-list .filter-btn').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  renderEvents();
}
function filterYear(y, el) {
  activeYear = y;
  document.querySelectorAll('#year-list .year-pill').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  renderEvents();
}

// 4. RENDER THE TIMELINE
function renderEvents() {
  var list = eventsData.filter(e => (activeType === 'ALL' || e.type === activeType) && (activeYear === 'ALL' || e.year === activeYear));
  
  // Calculate Top Stats
  let totalExpense = 0;
  let totalPeople = 0;
  
  list.forEach(function(item) {
    totalExpense += Number(item.expense) || 0;
    totalPeople += Number(item.Donors) || 0;
  });

  document.getElementById('st-camp').textContent = String(list.length).padStart(2, '0');
  document.getElementById('st-expense').textContent = '৳ ' + totalExpense.toLocaleString();
  document.getElementById('st-people').textContent = totalPeople.toLocaleString();

  // Render Cards
  document.getElementById('timeline-items').innerHTML = list.map((item, i) => {
    var isRam = item.type === 'Ramadan';
    var dotBg = i === 0 ? '#56aeff' : '#0077b2';
    var badge = isRam
      ? '<span style="padding: 3px 10px; border-radius: 999px; border: 1px solid rgba(246,183,88,0.6); color: #f6b758; font-family: \'JetBrains Mono\', monospace; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase"><span style="display:inline-block;width:6px;height:6px;border-radius:50%;background:#f6b758;margin-right:6px;vertical-align:middle"></span>Ramadan</span>'
      : '<span style="padding: 3px 10px; border-radius: 999px; border: 1px solid rgba(86,174,255,0.6); color: #56aeff; font-family: \'JetBrains Mono\', monospace; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase">' + item.type + '</span>';

    let items = Number(item.itemsDistributed) || 0;
    let people = Number(item.Donors) || 0;
    let expense = Number(item.expense) || 0;

    // Clean Receipt Stats
    let statsHTML = `
      <div style="display: grid; grid-template-columns: 110px 1fr; gap: 6px 12px; margin: 16px 0; font-family: 'JetBrains Mono', monospace; font-size: 14px; background: rgba(3,3,46,0.4); padding: 16px; border-radius: 8px; border: 1px solid rgba(86,174,255,0.15);">
        <span style="color: rgba(240,240,234,0.6);">Packages</span>
        <span style="color: #f6b758; font-weight: 700;">: ${items.toLocaleString()}</span>
        
        <span style="color: rgba(240,240,234,0.6);">Donors</span>
        <span style="color: #f6b758; font-weight: 700;">: ${people.toLocaleString()}</span>
        
        <span style="color: rgba(240,240,234,0.6);">Expense</span>
        <span style="color: #f6b758; font-weight: 700;">: ৳ ${expense.toLocaleString()}</span>
      </div>
    `;

    // Download Button
    let reportBtn = '';
    if (item.reportUrl && item.reportUrl !== '#') {
      reportBtn = '<a href="' + item.reportUrl + '" download style="display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: 6px; background: rgba(86,174,255,0.1); border: 1px solid rgba(86,174,255,0.3); color: #56aeff; font-size: 12px; font-family: \'JetBrains Mono\', monospace; font-weight: 700; text-decoration: none; transition: 0.2s;" onmouseover="this.style.background=\'rgba(86,174,255,0.2)\'" onmouseout="this.style.background=\'rgba(86,174,255,0.1)\'"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg> Download PDF Report</a>';
    }

        // Build Image HTML (with fallback if missing)
    let imageHTML = '';
    if (item.imageUrl) {
      imageHTML = `<img src="${item.imageUrl}" alt="${item.title}" style="width: 100%; height: 100%; object-fit: cover; display: block;" onerror="this.outerHTML='<div style=\\'display:flex;align-items:center;justify-content:center;height:100%;font-family:JetBrains Mono,monospace;font-size:13px;color:rgba(240,240,234,0.7)\\'>[ Image not found ]</div>'">`;
    } else {
      imageHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100%;font-family:JetBrains Mono,monospace;font-size:13px;color:rgba(240,240,234,0.7)">[ No Photo ]</div>';
    }

    return '<div style="position: relative">' +
      '<div style="position: absolute; left: -36px; top: 6px; width: 16px; height: 16px; border-radius: 50%; background: ' + dotBg + '; border: 3px solid #060644"></div>' +
      '<div style="font-family: \'JetBrains Mono\', monospace; font-size: 13px; letter-spacing: 0.14em; color: #56aeff; margin-bottom: 10px">[ ' + item.year + ' ]</div>' +
      '<div style="display: flex; flex-wrap: wrap; border: 1px solid rgba(86,174,255,0.25); border-radius: 16px; overflow: hidden; background: rgba(0,73,149,0.16)">' +

        // THE DYNAMIC IMAGE
        '<div class="campaign-img-wrapper">' + imageHTML + '</div>' +

        '<div style="flex: 2 1 320px; padding: 28px; display: flex; flex-direction: column; justify-content: center;">' +
          '<div style="display: flex; gap: 8px; margin-bottom: 8px;">' + badge + '</div>' +
          '<div style="font-family: \'Space Grotesk\', sans-serif; font-size: 26px; font-weight: 700; line-height: 1.2; margin-bottom: 4px;">' + item.title + '</div>' +
          statsHTML +
          '<div style="margin-top: auto;">' + reportBtn + '</div>' +
        '</div>' +
      '</div>' +
    '</div>';
  }).join('');
}

// Initial render
renderEvents();
</script>


<!-- FOOTER WITH ADDRESS & CONTACTS -->
<div id="footer-placeholder"></div>

<script>
  document.addEventListener("DOMContentLoaded", () => {

    // 1. Universal Favicon
    const favicon = document.createElement('link');
    favicon.rel = 'icon';
    favicon.type = 'image/png';
    favicon.href = 'images/logo.png'; // Adjust path if needed
    document.head.appendChild(favicon);

    // 2. Fetch Header and Footer simultaneously
    const headerPlaceholder = document.getElementById("header-placeholder");
    const footerPlaceholder = document.getElementById("footer-placeholder");

    Promise.all([
      fetch("header.html").then(res => res.text()),
      fetch("footer.html").then(res => res.text())
    ])
    .then(([headerData, footerData]) => {

      // Inject Header
      if (headerPlaceholder) {
        headerPlaceholder.innerHTML = headerData;

        // --- MOBILE MENU TOGGLE LOGIC ---
        const mobileBtn = document.getElementById("mobile-menu-toggle");
        const navLinksWrapper = document.getElementById("nav-links");
        if (mobileBtn && navLinksWrapper) {
          mobileBtn.addEventListener("click", () => {
            navLinksWrapper.classList.toggle("active");
          });
        }
        // --------------------------------

        // Auto-highlight active nav link
        let currentPage = window.location.pathname.split("/").pop();
        if (currentPage === "" || currentPage === "/") currentPage = "index.html";

        const navLinks = headerPlaceholder.querySelectorAll(".nav-link");
        navLinks.forEach(link => {
          if (link.getAttribute("href") === currentPage) {
            link.classList.add("active");
          }
        });
      }

      // Inject Footer
      if (footerPlaceholder) {
        footerPlaceholder.innerHTML = footerData;
      }
    })
    .catch(error => console.error("Error loading components:", error));
  });
</script>
</div>
