<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Al Ihsan Verification</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&family=DM+Sans:wght@400;500&family=JetBrains+Mono:wght@700&display=swap');
  </style>
</head>
<body style="margin: 0; padding: 0; background-color: #03032e; font-family: 'DM Sans', Arial, sans-serif; -webkit-font-smoothing: antialiased;">

  <!-- Outer Background Table -->
  <table width="100%" border="0" cellpadding="0" cellspacing="0" bgcolor="#03032e" style="background-color: #03032e; padding: 40px 10px;">
    <tr>
      <td align="center">

        <!-- Main Card -->
        <table width="100%" max-width="500" border="0" cellpadding="0" cellspacing="0" bgcolor="#060644" style="max-width: 500px; width: 100%; background-color: #060644; border: 1px solid #56aeff; border-radius: 16px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.5);">

          <!-- Top Accent Bar -->
          <tr>
            <td height="4" style="background-color: #56aeff; font-size: 0; line-height: 0;">&nbsp;</td>
          </tr>

          <!-- Content Area -->
          <tr>
            <td style="padding: 40px 32px;">

              <!-- Logo / Brand -->
              <table width="100%" border="0" cellpadding="0" cellspacing="0">
                <tr>
                  <td align="center" style="padding-bottom: 24px;">
                    <div style="font-family: 'Space Grotesk', Arial, sans-serif; font-size: 24px; font-weight: 700; color: #f0f0ea; letter-spacing: 0.01em;">
                      Al Ihsan
                    </div>
                  </td>
                </tr>
              </table>

              <!-- Minimal Heading -->
              <h1 style="margin: 0 0 24px 0; font-family: 'Space Grotesk', Arial, sans-serif; font-size: 20px; font-weight: 700; color: #f0f0ea; text-align: center; line-height: 1.3;">
                Your Verification Code
              </h1>

              <!-- Highlight-to-Copy OTP Box -->
              <table width="100%" border="0" cellpadding="0" cellspacing="0">
                <tr>
                  <td align="center" style="padding-bottom: 24px;">
                    <!-- The user-select: all property makes the text highlight with a single tap -->
                    <div style="background-color: #03032e; border: 1px dashed #56aeff; border-radius: 12px; padding: 20px 40px; display: inline-block; cursor: pointer;">
                      <span style="font-family: 'JetBrains Mono', 'Courier New', monospace; font-size: 36px; font-weight: 700; color: #f6b758; letter-spacing: 8px; margin-left: 8px; user-select: all; -webkit-user-select: all; -moz-user-select: all;">
                        {{ .Token }}
                      </span>
                    </div>
                  </td>
                </tr>
              </table>

              <!-- Security Note -->
              <p style="margin: 0; font-size: 13px; line-height: 1.5; color: rgba(240,240,234,0.5); text-align: center;">
                Expires in 5 minutes. Click the code to copy.
              </p>

            </td>
          </tr>
        </table>

        <!-- Footer -->
        <table width="100%" max-width="500" border="0" cellpadding="0" cellspacing="0" style="max-width: 500px; width: 100%; margin-top: 24px;">
          <tr>
            <td align="center" style="font-size: 12px; color: rgba(240,240,234,0.4); line-height: 1.5;">
              &copy; 2026 Al Ihsan Foundation.
            </td>
          </tr>
        </table>

      </td>
    </tr>
  </table>

</body>
</html>
